name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install isort black

      - name: Run isort check
        run: isort --check-only --diff .

      - name: Run black check
        run: black --check --diff --line-length 100 .

  # The repository holds only the package, so instead of the test suite the job installs the
  # package the way a user would and runs it on every supported Python.
  smoke:
    name: Install and run (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Extract features and call the command line
        run: |
          python - <<'PY'
          import ru_stylometry
          from ru_stylometry import StylometricVectorizer, feature_names

          texts = [
              "Привет, мир! Это первый текст, написанный человеком.",
              "Нейросеть пишет связный текст. Он звучит правильно.",
          ]
          matrix = StylometricVectorizer().fit_transform(texts)
          assert matrix.shape == (2, len(feature_names())), matrix.shape
          print("ru-stylometry", ru_stylometry.__version__, matrix.shape)
          PY
          ru-stylometry --help

  publish:
    name: Publish to Test PyPI
    runs-on: ubuntu-latest
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check the distributions
        run: twine check dist/*

      - name: Publish to Test PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TESTPYPI_TOKEN }}
        run: twine upload --repository testpypi dist/*
